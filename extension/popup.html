<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Answer Sources</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="20" height="20" />
      <h1>Sources in this answer</h1>
    </header>

    <label class="you">
      <span>Your domain</span>
      <input id="domain" type="text" placeholder="example.com" spellcheck="false" autocomplete="off" />
    </label>

    <p id="status" class="status" role="status"></p>
    <ol id="list" class="list"></ol>

    <div class="row">
      <button id="copy" type="button" hidden>Copy as CSV</button>
    </div>

    <footer>
      <a id="cta" href="https://recomma.ai/?utm_source=chrome-extension&amp;utm_medium=popup" target="_blank" rel="noopener">
        One answer is one sample. Recomma tracks every answer, every day →
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
